<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>炸金花 · 管理后台</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .admin-stat { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px; text-align: center; }
    .admin-stat b { display: block; font-size: 24px; color: var(--gold); }
    .admin-stat span { font-size: 13px; color: var(--muted); }
    .admin-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .admin-toolbar input { flex: 1; min-width: 160px; background: rgba(6,14,10,0.7); border: 1px solid var(--panel-border); border-radius: 10px; color: var(--text); padding: 9px 12px; font-size: 14px; }
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--panel-border); border-radius: 12px; }
    table.users { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
    table.users th, table.users td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
    table.users th { color: var(--muted); font-weight: 600; background: rgba(6,14,10,0.5); position: sticky; top: 0; }
    table.users tr.banned { opacity: 0.55; }
    .uname { display: flex; align-items: center; gap: 6px; }
    .uname .av { font-size: 18px; }
    .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--panel-border); }
    .badge.on { color: var(--ok); border-color: rgba(52,211,153,0.4); }
    .badge.admin { color: var(--gold); border-color: rgba(242,200,75,0.4); }
    .badge.ban { color: var(--err); border-color: rgba(248,113,113,0.4); }
    .coins-cell { color: var(--gold); font-weight: 700; }
    .row-ops { display: flex; gap: 5px; flex-wrap: wrap; }
    .row-ops button { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
    .admin-hint { color: var(--muted); padding: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="bg-felt"></div>
  <header class="topbar">
    <div class="brand">🛠️ 炸金花后台</div>
    <nav class="topnav">
      <a href="/zhajinhua/">← 返回游戏</a>
      <span id="who" class="auth-area"></span>
    </nav>
  </header>

  <div class="admin-wrap">
    <div id="denied" class="admin-hint hidden">没有管理员权限。<a href="/zhajinhua/" class="link">返回游戏</a></div>
    <div id="panel" class="hidden">
      <div class="admin-stats" id="stats"></div>
      <div class="admin-toolbar">
        <input id="search" type="text" placeholder="🔍 搜索用户名 / ID" />
        <button class="ghost small" id="refreshBtn">⟳ 刷新</button>
      </div>
      <div class="tbl-wrap">
        <table class="users">
          <thead>
            <tr>
              <th>ID</th><th>用户</th><th>金币</th><th>战绩(局/胜/盈亏)</th>
              <th>注册时间</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
