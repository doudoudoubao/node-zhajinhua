services:
  zhajinhua:
    build: .
    container_name: zhajinhua
    restart: unless-stopped
    ports:
      # 左边是 VPS 对外端口，右边是容器内端口
      - "25500:25500"
    environment:
      - PORT=25500
      - HOST=0.0.0.0
      - ZJH_DATA_DIR=/app/data
    volumes:
      # 持久化用户数据（注册 / 好友 / 金币 / 战绩），容器重建后仍保留
      - ./data:/app/data
